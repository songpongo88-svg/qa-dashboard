name: Debug AA205349

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-aa205349.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Inspect AA205349 in legacy workbooks
        run: |
          node <<'NODE'
          const XLSX = require('xlsx');
          const target = 'AA205349';
          const files = [
            'public/QA_RawData_March-May2026.xlsx',
            'public/Appeal ROWDATA.xlsx',
            'public/Appeal_ROWDATA.xlsx',
          ];
          const norm = (v) => String(v ?? '').replace(/\s+/g, '').toUpperCase();
          for (const file of files) {
            console.log(`\n===== ${file} =====`);
            const wb = XLSX.readFile(file, { cellDates: true });
            console.log('Sheets:', wb.SheetNames.join(', '));
            for (const sheetName of wb.SheetNames) {
              const ws = wb.Sheets[sheetName];
              const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
              let found = 0;
              for (let r = 0; r < rows.length; r++) {
                const row = rows[r] || [];
                if (!row.some((cell) => norm(cell) === target)) continue;
                found++;
                let headerIndex = -1;
                for (let h = r; h >= 0; h--) {
                  const header = (rows[h] || []).map((v) => String(v ?? '').trim().toLowerCase());
                  if (header.includes('case id') || header.some((x) => x.includes('case id'))) {
                    headerIndex = h;
                    break;
                  }
                }
                const headers = headerIndex >= 0 ? rows[headerIndex] : [];
                const obj = {};
                for (let c = 0; c < row.length; c++) {
                  const key = String(headers[c] ?? `COL_${c+1}`).trim() || `COL_${c+1}`;
                  const val = row[c];
                  if (val !== null && val !== undefined && String(val).trim() !== '') obj[key] = val;
                }
                console.log(`Sheet=${sheetName} Row=${r+1} HeaderRow=${headerIndex+1}`);
                console.log(JSON.stringify(obj, (k,v) => v instanceof Date ? v.toISOString() : v, 2));
              }
              if (!found) console.log(`No ${target} in sheet ${sheetName}`);
            }
          }
          NODE

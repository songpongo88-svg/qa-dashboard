name: Diagnose Historical RawData

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-jan-feb-workbook-v2.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Inspect historical workbook month coverage
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from collections import Counter, defaultdict
          from datetime import datetime, date
          import re

          files = [
            'public/QA_RawData_January-February2026.xlsx',
            'public/QA_RawData_March-May2026.xlsx',
          ]
          def norm(v): return re.sub(r'[^a-z0-9ก-๙]+','',str(v or '').strip().lower())
          def month_of(v):
              if isinstance(v,(datetime,date)): return f'{v.year:04d}-{v.month:02d}'
              s=str(v or '').strip()
              m=re.match(r'^(\d{4})-(\d{1,2})-',s)
              if m: return f'{int(m.group(1)):04d}-{int(m.group(2)):02d}'
              m=re.match(r'^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})',s)
              if m: return f'{int(m.group(3)):04d}-{int(m.group(2)):02d}'
              return ''
          for path in files:
              print('\nFILE',path)
              wb=load_workbook(path,data_only=True,read_only=True)
              ws=wb['Raw_Data'] if 'Raw_Data' in wb.sheetnames else wb[wb.sheetnames[0]]
              rows=list(ws.iter_rows(values_only=True))
              hi=-1
              for i,row in enumerate(rows[:50]):
                  vals={norm(v) for v in row}
                  if 'agentname' in vals and 'caseid' in vals:
                      hi=i;break
              print('HEADER_IDX',hi)
              headers=[str(v or '').strip() for v in rows[hi]]
              idx={norm(h):j for j,h in enumerate(headers)}
              print('INDEXES',{k:idx.get(k) for k in ['agentname','caseid','casedate','auditdate','monthlabel','monthstart']})
              ci=idx['caseid']; ai=idx['agentname']
              data=[r for r in rows[hi+1:] if str(r[ci] or '').strip()]
              print('DATA_ROWS',len(data),'UNIQUE_CASES',len(set(str(r[ci]).strip().upper() for r in data)))
              for key in ['casedate','auditdate','monthstart']:
                  j=idx.get(key)
                  if j is not None:
                      print('MONTH_COUNTS',key,sorted(Counter(month_of(r[j]) for r in data).items()))
              j=idx.get('monthlabel')
              if j is not None: print('MONTH_LABELS',sorted(Counter(str(r[j] or '').strip() for r in data).items()))
              cd=idx.get('casedate')
              if cd is not None:
                  per=defaultdict(Counter)
                  for r in data: per[month_of(r[cd])][str(r[ai] or '').strip()]+=1
                  for m in sorted(per): print('PER_AGENT_CASEDATE',m,sorted(per[m].items()))
          PY

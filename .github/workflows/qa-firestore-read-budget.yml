name: QA Firestore read budget safety
on:
  push:
    branches:
      - fix/qa-firestore-read-budget-20261112
  pull_request:
    paths:
      - "src/useDashboardAutoRefresh.ts"
      - "src/App.tsx"
      - "scripts/test-dashboard-refresh.mjs"
      - ".github/workflows/qa-firestore-read-budget.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dashboard revision and cache regression
        run: npm run test:dashboard-refresh
      - name: Firestore quota safety
        run: npm run test:firestore-quota
      - name: Coaching regression
        run: npm run test:monthly-coaching
      - name: Compile QA Dashboard Preview
        run: npx vite build

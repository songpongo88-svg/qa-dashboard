name: QA Firestore read budget safety
on:
  push:
    branches:
      - fix/qa-firestore-read-budget-20261112
  pull_request:
    paths:
      - "src/useDashboardAutoRefresh.ts"
      - "src/firestoreReadPolicy.ts"
      - "src/evaluationStore.ts"
      - "scripts/test-firestore-quota-controls.mjs"
      - "src/App.tsx"
      - "src/currentUserStorage.ts"
      - "build/usernameIdentityPolicyPatchV2.js"
      - "build/firestoreQuotaProtectionPatch.js"
      - "scripts/test-login-storage-quota.mjs"
      - "src/AnnouncementHub.tsx"
      - "src/announcementStore.ts"
      - "src/AnnouncementDetail.tsx"
      - "src/thankYouSupport2026.mjs"
      - "scripts/test-thank-you-support.mjs"
      - "scripts/test-announcement-detail.mjs"
      - "src/DashboardMockup.tsx"
      - "src/themeUsageReadPolicy.ts"
      - "src/appealCaseEventsPartition.ts"
      - "scripts/test-theme-usage-read-policy.mjs"
      - "scripts/test-appeal-case-read-sharing.mjs"
      - "scripts/test-dashboard-refresh.mjs"
      - ".github/workflows/qa-firestore-read-budget.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Login browser storage quota fallback and secure-session regression
        run: node scripts/test-login-storage-quota.mjs
      - name: Dashboard revision and cache regression
        run: npm run test:dashboard-refresh
      - name: Theme picker visual read cache safety
        run: node scripts/test-theme-usage-read-policy.mjs
      - name: Selected-case Appeal query sharing
        run: node scripts/test-appeal-case-read-sharing.mjs
      - name: Firestore quota safety
        run: npm run test:firestore-quota
      - name: Thank you Support recipient, stage and audit safety
        run: node scripts/test-thank-you-support.mjs
      - name: Announcement inbox and full-detail regression
        run: node scripts/test-announcement-detail.mjs
      - name: Coaching regression
        run: npm run test:monthly-coaching
      - name: Compile QA Dashboard with required project prebuild patches
        run: VERCEL=1 npm run build

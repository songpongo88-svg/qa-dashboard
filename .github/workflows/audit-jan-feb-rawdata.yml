name: Audit Jan-Feb RawData

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-jan-feb-rawdata.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit workbook
        run: |
          node --input-type=module <<'NODE'
          import XLSX from 'xlsx';
          const wb = XLSX.readFile('public/QA_RawData_January-February2026.xlsx', { cellDates: true });
          const ws = wb.Sheets['Raw_Data'] || wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
          const norm = v => String(v ?? '').trim().toLowerCase().replace(/[^a-z0-9ก-๙]+/g, '');
          const headerRowIndex = rows.findIndex(r => r.some(v => norm(v) === 'auditdate') && r.some(v => norm(v) === 'agentname') && r.some(v => norm(v) === 'caseid'));
          const headerRow = rows[headerRowIndex] || [];
          const idx = name => headerRow.findIndex(v => norm(v) === norm(name));
          const auditIdx = idx('Audit Date');
          const caseDateIdx = idx('Case Date');
          const agentIdx = idx('Agent Name');
          const caseIdx = idx('Case ID');
          const monthLabelIdx = idx('Month Label');
          const monthKeyIdx = idx('Month Key');
          const monthOf = value => {
            if (value instanceof Date && !Number.isNaN(value.getTime())) return `${value.getFullYear()}-${String(value.getMonth()+1).padStart(2,'0')}`;
            const s = String(value ?? '').trim();
            if (!s) return '';
            let m = s.match(/^(\d{4})-(\d{1,2})-/); if (m) return `${m[1]}-${m[2].padStart(2,'0')}`;
            m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if (m) return `${m[3]}-${String(Number(m[2])).padStart(2,'0')}`;
            const d = new Date(s); return Number.isNaN(d.getTime()) ? '' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          };
          const data = rows.slice(headerRowIndex + 1).filter(r => String(r[caseIdx] ?? '').trim());
          console.log('HEADER_ROW_INDEX', headerRowIndex);
          console.log('INDEXES', JSON.stringify({auditIdx,caseDateIdx,agentIdx,caseIdx,monthLabelIdx,monthKeyIdx}));
          console.log('DATA_ROWS', data.length);
          for (const [label, di] of [['Audit Date',auditIdx],['Case Date',caseDateIdx]]) {
            const months = {};
            const agents = {};
            for (const r of data) {
              const month = monthOf(r[di]);
              months[month] = (months[month] || 0) + 1;
              const agent = String(r[agentIdx] ?? '').trim();
              agents[month] ||= {};
              agents[month][agent] = (agents[month][agent] || 0) + 1;
            }
            console.log('MONTH_COUNTS', label, JSON.stringify(months));
            for (const month of Object.keys(agents).sort()) {
              console.log('AGENT_COUNTS', label, month, JSON.stringify(Object.fromEntries(Object.entries(agents[month]).sort((a,b)=>a[0].localeCompare(b[0])))));
            }
          }
          const labels = {};
          const keys = {};
          for (const r of data) {
            const ml = String(r[monthLabelIdx] ?? '').trim(); labels[ml] = (labels[ml] || 0) + 1;
            const mk = String(r[monthKeyIdx] ?? '').trim(); keys[mk] = (keys[mk] || 0) + 1;
          }
          console.log('MONTH_LABEL_COUNTS', JSON.stringify(labels));
          console.log('MONTH_KEY_COUNTS', JSON.stringify(keys));
          const idCounts = data.reduce((m,r)=>{const id=String(r[caseIdx]??'').trim().toUpperCase();m[id]=(m[id]||0)+1;return m;},{});
          const dups = Object.entries(idCounts).filter(([,n])=>n>1);
          console.log('DUPLICATE_CASE_IDS', JSON.stringify({count:dups.length,items:dups.slice(0,100)}));
          NODE

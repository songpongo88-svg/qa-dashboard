name: QA Sparks existing-password migration smoke
on:
  push:
    branches:
      - feat/sparks-existing-qa-password-login-20261111
  pull_request:
    paths:
      - 'src/sparksQaPasswordLogin.ts'
      - 'src/SparksEmailAuth.tsx'
      - 'src/SparksQaCredentialMigration.tsx'
      - 'src/App.tsx'
      - 'scripts/test-sparks-qa-password-login.mjs'
      - 'scripts/test-sparks-qa-credential-preflight.mjs'
      - 'scripts/test-sparks-qa-migration-runner.mjs'
      - 'server/sparksQaMigrationRunner.js'
      - 'supabase/functions/qa-sparks-qa-password-migration/index.ts'
      - 'server/sparksQaCredentialPreflight.js'
      - 'api/sparks-admin.js'
      - '.github/workflows/test-sparks-qa-password-migration.yml'
permissions:
  contents: read
jobs:
  verify-existing-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: QA Sparks migration authentication checks
        run: node scripts/test-sparks-qa-password-login.mjs
      - name: Server-side QA credential preflight regression (synthetic data only)
        run: node --test scripts/test-sparks-qa-credential-preflight.mjs
      - name: QA Sparks private credential transfer regression
        run: node --test scripts/test-sparks-qa-migration-runner.mjs
      - name: Confirm QA password change handler invokes Sparks sync
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const app=readFileSync('src/App.tsx','utf8'); assert.ok(app.includes('await syncSparksQaPasswordChange(')); assert.ok(app.includes('savedCentrally || savedToProfileStore')); assert.ok(app.includes('ยังไม่ได้ยืนยันการซิงก์รหัสไป QA Sparks'));"

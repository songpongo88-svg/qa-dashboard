name: Fix Case Detail Appeal Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case-detail-appeal-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Case Detail appeal layout fix
        run: node scripts/fix-case-detail-appeal-layout.mjs
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Record guide review and commit
        run: |
          rm .github/workflows/fix-case-detail-appeal-layout.yml
          rm scripts/fix-case-detail-appeal-layout.mjs
          node scripts/check-user-guide.mjs --record --reason "Reviewed Case Detail appeal topic ordering and restored Appeal Reason metadata" --no-content-change
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Case Detail appeal reason and metadata order"
          git push

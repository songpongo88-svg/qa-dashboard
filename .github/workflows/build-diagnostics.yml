name: Build Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Review current production source
        run: npm run guide:review -- --reason "Reviewed Case Detail appeal metadata order, Appeal Submit timestamp recovery, 7 Days Theme label, and production build diagnostics" --no-content-change
      - name: Build with Vercel production environment
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: npm run build
      - name: Commit current guide review only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide-release-review.json
          if git diff --cached --quiet; then
            echo "No guide review change to commit"
            exit 0
          fi
          git commit -m "Review Case Detail appeal and theme production source"
          git push

name: Remove Duplicate Case Detail Score

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-duplicate-case-detail-score.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove duplicate topic score summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'src/DashboardMockup.tsx';
          let s = fs.readFileSync(file, 'utf8');
          const pattern = /\n\s{12}<div className="mt-5 grid gap-x-8 gap-y-3 text-sm lg:grid-cols-\[170px_minmax\(0,1fr\)\]">[\s\S]*?\n\s{12}<\/div>\n\n\s{12}<div className="mt-6 space-y-4">/;
          const match = s.match(pattern);
          if (!match) throw new Error('Duplicate Case Detail score block not found');
          if (!match[0].includes('>Score</div>') || !match[0].includes('>Max Score</div>') || !match[0].includes('>Status</div>')) {
            throw new Error('Matched Case Detail block did not contain expected score fields');
          }
          s = s.replace(pattern, '\n\n            <div className="mt-4 space-y-4">');
          fs.writeFileSync(file, s, 'utf8');
          NODE
      - name: Record guide review and commit
        run: |
          rm .github/workflows/remove-duplicate-case-detail-score.yml
          node scripts/check-user-guide.mjs --record --reason "Reviewed Case Detail topic layout after removing duplicated Score Max Score and Status block" --no-content-change
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate Case Detail topic score summary"
          git push

name: Fix Appeal Submit Fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-appeal-submit-fallback.yml"

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Appeal Submit fallback only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/DashboardMockup.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'function buildAppealTimelineMap\(logs: UsageLogEvent\[\]\) \{.*?\n\}\n\nfunction buildApprovedAppealMergeMap', re.S)
          replacement = r'''function appealRequestIdTimestamp(value: unknown) {
            const match = String(value ?? "").trim().match(/-(\d{13})(?:$|[^0-9])/);
            if (!match) return "";
            const epochMs = Number(match[1]);
            if (!Number.isFinite(epochMs)) return "";
            const date = new Date(epochMs);
            return Number.isNaN(date.getTime()) ? "" : date.toISOString();
          }

          function appealEventDateTime(log: UsageLogEvent, kind: "submitted" | "reviewed") {
            const details = (log.details || {}) as Record<string, unknown>;
            const requestId = details.requestId || log.id || "";
            const candidates = kind === "submitted"
              ? [
                  details.submittedAt,
                  details.appealSubmittedAt,
                  details.appealSubmitAt,
                  details.submitted_at,
                  details.submitDateTime,
                  details.submittedDateTime,
                  log.created_at,
                  appealRequestIdTimestamp(requestId),
                ]
              : [
                  details.reviewedAt,
                  details.appealReviewedAt,
                  details.appealResultAt,
                  details.reviewed_at,
                  details.resultDateTime,
                  log.created_at,
                ];

            for (const value of candidates) {
              const formatted = formatCaseDetailDateTime(value);
              if (formatted) return formatted;
            }
            return "";
          }

          function appealEventRank(log: UsageLogEvent, kind: "submitted" | "reviewed" | "reset") {
            const details = (log.details || {}) as Record<string, unknown>;
            const candidates = kind === "submitted"
              ? [details.submittedAt, log.created_at, appealRequestIdTimestamp(details.requestId || log.id || "")]
              : kind === "reviewed"
                ? [details.reviewedAt, log.created_at]
                : [details.resetAt, log.created_at];
            for (const value of candidates) {
              const parsed = new Date(String(value || "")).getTime();
              if (!Number.isNaN(parsed)) return parsed;
            }
            return 0;
          }

          function buildAppealTimelineMap(logs: UsageLogEvent[]) {
            const map = new Map<string, AppealTimelineItem>();
            buildLatestAppealRequestMap(logs).forEach((request, caseId) => {
              if (request.status === "Reset") return;
              map.set(caseId, {
                caseId,
                submittedAt: formatCaseDetailDateTime(request.submittedAt),
                reviewedAt: formatCaseDetailDateTime(request.reviewedAt),
              });
            });

            const direct = new Map<string, {
              submittedAt: string;
              reviewedAt: string;
              submittedRank: number;
              reviewedRank: number;
              resetRank: number;
            }>();

            logs.forEach((log) => {
              if (!["appeal_request_submitted", "appeal_request_reviewed", "appeal_request_reset"].includes(log.event_type)) return;
              const details = (log.details || {}) as Record<string, unknown>;
              const rawCaseId = log.case_id || details.caseId || details.case_id || "";
              const caseIds = splitAppealCaseIds(rawCaseId);
              if (!caseIds.length) return;

              caseIds.forEach((caseId) => {
                const current = direct.get(caseId) || {
                  submittedAt: "",
                  reviewedAt: "",
                  submittedRank: 0,
                  reviewedRank: 0,
                  resetRank: 0,
                };

                if (log.event_type === "appeal_request_submitted") {
                  const rank = appealEventRank(log, "submitted");
                  if (rank >= current.submittedRank) {
                    current.submittedRank = rank;
                    current.submittedAt = appealEventDateTime(log, "submitted");
                  }
                }

                if (log.event_type === "appeal_request_reviewed") {
                  const rank = appealEventRank(log, "reviewed");
                  if (rank >= current.reviewedRank) {
                    current.reviewedRank = rank;
                    current.reviewedAt = appealEventDateTime(log, "reviewed");
                  }
                  if (!current.submittedAt) {
                    const requestIdTime = formatCaseDetailDateTime(
                      appealRequestIdTimestamp(details.requestId || log.id || "")
                    );
                    if (requestIdTime) {
                      current.submittedAt = requestIdTime;
                      const requestIdRank = new Date(
                        appealRequestIdTimestamp(details.requestId || log.id || "")
                      ).getTime();
                      current.submittedRank = Number.isNaN(requestIdRank) ? current.submittedRank : requestIdRank;
                    }
                  }
                }

                if (log.event_type === "appeal_request_reset") {
                  current.resetRank = Math.max(current.resetRank, appealEventRank(log, "reset"));
                }

                direct.set(caseId, current);
              });
            });

            direct.forEach((timeline, caseId) => {
              const latestActivityRank = Math.max(timeline.submittedRank, timeline.reviewedRank);
              if (timeline.resetRank && timeline.resetRank >= latestActivityRank) return;
              const current = map.get(caseId);
              map.set(caseId, {
                caseId,
                submittedAt: current?.submittedAt || timeline.submittedAt,
                reviewedAt: current?.reviewedAt || timeline.reviewedAt,
              });
            });

            return map;
          }

          function buildApprovedAppealMergeMap'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'buildAppealTimelineMap patch failed: {count}')

          old_headers = '"Appeal Submit Date & Time", "Appeal Submit Date", "Appeal Submitted At", "Submitted At", "Appeal Submitted Date", "Appeal Date & Time", "Appeal Date", "Submit Date & Time", "Submit Date"'
          new_headers = '"Appeal Submit Date & Time", "Appeal Submit Date", "Appeal Submitted At", "Submitted At", "Appeal Submitted Date", "Appeal Submitted Date & Time", "Submitted Date & Time", "Submitted Date", "Submission Date & Time", "Submission Date", "Appeal Submit", "Appeal Date & Time", "Appeal Date", "Submit Date & Time", "Submit Date"'
          if old_headers not in text:
              raise SystemExit('Appeal Submit Excel header anchor not found')
          text = text.replace(old_headers, new_headers, 1)

          old_fetch = '''const appealLogs = await fetchAppealEvents([
          "appeal_request_submitted",
          "appeal_request_reviewed",
          "appeal_request_reset",
        ], { limit: 1000, forceRefresh: true });'''
          new_fetch = '''const appealLogs = await fetchAppealEvents([
          "appeal_request_submitted",
          "appeal_request_reviewed",
          "appeal_request_reset",
        ], { limit: 2000, forceRefresh: true });'''
          if old_fetch not in text:
              raise SystemExit('Appeal event fetch anchor not found')
          text = text.replace(old_fetch, new_fetch, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Preserve intended source
        run: |
          cp src/DashboardMockup.tsx /tmp/DashboardMockup.tsx

      - name: Review intended source
        run: npm run guide:review -- --reason "Reviewed targeted Appeal Submit timestamp fallback for historical appeal cases" --no-content-change

      - name: Preserve guide review
        run: cp docs/guide-release-review.json /tmp/guide-release-review.json

      - name: Verify production build
        env:
          VERCEL: "1"
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Restore clean intended source after prebuild patches
        shell: bash
        run: |
          git reset --hard HEAD
          cp /tmp/DashboardMockup.tsx src/DashboardMockup.tsx
          cp /tmp/guide-release-review.json docs/guide-release-review.json

      - name: Commit targeted fix only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DashboardMockup.tsx docs/guide-release-review.json
          if git diff --cached --quiet; then
            echo "No targeted source changes"
            exit 0
          fi
          git commit -m "Fix historical Appeal Submit timestamps"
          git push

name: Fix Appeal Timestamps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-appeal-submit-fallback.yml"
      - "scripts/fix-appeal-submit-fallback-v2.mjs"

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply unified Appeal timestamp fix
        run: node scripts/fix-appeal-submit-fallback-v2.mjs
      - name: Preserve intended source
        run: cp src/DashboardMockup.tsx /tmp/DashboardMockup.tsx
      - name: Review intended source
        run: npm run guide:review -- --reason "Reviewed unified Appeal Submit and Appeal Result timestamps for legacy E-Mail and Firebase cases" --no-content-change
      - name: Preserve guide review
        run: cp docs/guide-release-review.json /tmp/guide-release-review.json
      - name: Verify production build
        env:
          VERCEL: "1"
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Restore intended source after build patches
        run: |
          git reset --hard HEAD
          cp /tmp/DashboardMockup.tsx src/DashboardMockup.tsx
          cp /tmp/guide-release-review.json docs/guide-release-review.json
      - name: Commit targeted fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DashboardMockup.tsx docs/guide-release-review.json
          git commit -m "Fix all Appeal Submit and Result timestamps"
          git push

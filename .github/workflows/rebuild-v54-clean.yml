name: Rebuild Clean V54 Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-v54-clean.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore clean v54 and apply metadata compatibility
        run: |
          git show bd541ab0f85b6c371c77a3804bfa09fdadf48d55:scripts/patch-appeal-review-reset-datetime-v54.mjs > scripts/patch-appeal-review-reset-datetime-v54.mjs
          node scripts/tmp-clean-v54-compat.mjs
      - name: Record guide review and clean temporary files
        run: |
          rm .github/workflows/rebuild-v54-clean.yml
          rm scripts/tmp-clean-v54-compat.mjs
          node scripts/check-user-guide.mjs --record --reason "Reviewed clean v54 compatibility with Case Detail appeal submitter and reviewer metadata" --no-content-change
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild clean appeal v54 metadata compatibility"
          git push

name: QA Core private outbox safety
on:
  pull_request:
    branches: [main]
    paths:
      - "migration/qa-core-private-outbox-stage.sql"
      - "server/qaLiveMirrorStage.js"
      - "server/qaCorePrivateOutbox.js"
      - "server/qaCoreOutboxUncertainty.js"
      - "server/qaWindowsSourceProbe.js"
      - "server/qaWindowsSourceDocumentReader.js"
      - "scripts/test-qa-windows-source-document-reader.mjs"
      - "scripts/test-qa-windows-source-probe.mjs"
      - "scripts/test-qa-core-private-outbox*.mjs"
      - "scripts/test-qa-core-outbox-uncertainty.mjs"
      - "scripts/check-qa-no-billing-source-writers.mjs"
      - "migration/qa-windows-source-signal-stage.sql"
      - "server/qaWindowsSourceSignalJournal.js"
      - "server/qaWindowsProbeBaseline.js"
      - "server/qaWindowsPrivateSignalStage.js"
      - "scripts/Install-QA-Windows-Private-Signal-Stage.ps1"
      - "scripts/Check-QA-Windows-Private-Signal-Stage.mjs"
      - "scripts/test-qa-windows-private-stage-acceptance.mjs"
      - "scripts/test-qa-windows-signal-install-policy.mjs"
      - "scripts/test-qa-windows-private-signal-stage.mjs"
      - "scripts/test-qa-windows-probe-baseline.mjs"
      - "scripts/test-qa-windows-source-signal-integration.mjs"
      - ".github/workflows/qa-core-private-outbox-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify source coverage guard (no live data calls)
        run: node scripts/check-qa-no-billing-source-writers.mjs
      - name: Test stage-only outbox authorization and quarantine
        run: |
          node --check server/qaCorePrivateOutbox.js
          node --check server/qaCoreOutboxUncertainty.js
          node --check server/qaWindowsSourceProbe.js
          node --check scripts/test-qa-windows-source-probe.mjs
          node scripts/test-qa-windows-source-probe.mjs
          node --check server/qaWindowsSourceDocumentReader.js
          node scripts/test-qa-windows-source-document-reader.mjs
          node --check server/qaWindowsSourceSignalJournal.js
          node --check server/qaWindowsProbeBaseline.js
          node scripts/test-qa-windows-probe-baseline.mjs
          node --check server/qaWindowsPrivateSignalStage.js
          node scripts/test-qa-windows-private-signal-stage.mjs
          node scripts/test-qa-windows-signal-install-policy.mjs
          node --check scripts/Check-QA-Windows-Private-Signal-Stage.mjs
          node scripts/test-qa-windows-private-stage-acceptance.mjs
      - name: Parse Windows PowerShell installer safely
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/Install-QA-Windows-Private-Signal-Stage.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'QA Windows installer PowerShell syntax invalid' }
          Write-Output 'PASS Windows PowerShell syntax parse (no execution)'
          node scripts/test-qa-core-private-outbox.mjs
          node scripts/test-qa-core-outbox-uncertainty.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: qa_cutover_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_cutover_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QA_PG_ISOLATED_TEST: "1"
      QA_TEST_DATABASE_URL: "postgresql://postgres:fixture_only@127.0.0.1:5432/qa_cutover_ci_test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install isolated database driver
        run: npm install --ignore-scripts --no-save --no-package-lock --no-audit --no-fund pg@8.16.3
      - name: Test private PostgreSQL outbox with NO real user data
        run: |
          node scripts/test-qa-core-private-outbox-stage-integration.mjs
          node scripts/test-qa-windows-source-signal-integration.mjs

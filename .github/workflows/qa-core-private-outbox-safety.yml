name: QA Core private outbox safety
on:
  pull_request:
    branches: [main]
    paths:
      - "migration/qa-core-private-outbox-stage.sql"
      - "server/qaLiveMirrorStage.js"
      - "server/qaCorePrivateOutbox.js"
      - "server/qaCoreOutboxUncertainty.js"
      - "server/qaCoreMutationCoordinatorStage.js"
      - "server/qaCoreSourceVerificationCandidateStage.js"
      - "server/qaCoreIndependentSourceReadStage.js"
      - "scripts/test-qa-core-independent-source-read.mjs"
      - "migration/qa-core-source-verification-candidate-stage.sql"
      - "scripts/test-qa-core-source-verification-candidate-integration.mjs"
      - "scripts/test-qa-core-mutation-coordinator.mjs"
      - "scripts/test-qa-core-mutation-coordinator-integration.mjs"
      - "server/qaWindowsSourceProbe.js"
      - "server/qaWindowsSourceDocumentReader.js"
      - "scripts/test-qa-windows-source-document-reader.mjs"
      - "scripts/test-qa-windows-source-probe.mjs"
      - "scripts/test-qa-core-private-outbox*.mjs"
      - "scripts/test-qa-core-outbox-uncertainty.mjs"
      - "scripts/check-qa-no-billing-source-writers.mjs"
      - "scripts/qa-firestore-writer-inventory.mjs"
      - "scripts/test-qa-firestore-writer-inventory.mjs"
      - "migration/qa-windows-source-signal-stage.sql"
      - "migration/qa-windows-verified-source-candidate-stage.sql"
      - "server/qaWindowsVerifiedCandidateJournal.js"
      - "scripts/test-qa-windows-verified-candidate-integration.mjs"
      - "server/qaWindowsSourceSignalJournal.js"
      - "server/qaWindowsProbeBaseline.js"
      - "server/qaWindowsPrivateSignalStage.js"
      - "scripts/Install-QA-Windows-Private-Signal-Stage.ps1"
      - "scripts/Check-QA-Windows-Private-Signal-Stage.mjs"
      - "scripts/Check-QA-Windows-Private-Stage.ps1"
      - "scripts/Check-QA-Windows-Firestore-Auth.ps1"
      - "scripts/Check-QA-Windows-Firestore-Metadata.ps1"
      - "scripts/Check-QA-Windows-Firestore-OneRead.ps1"
      - "scripts/test-qa-windows-firestore-one-read-policy.mjs"
      - "scripts/test-qa-windows-firestore-one-read-budget-integration.mjs"
      - "server/qaFirestoreRestSnapshot.js"
      - "server/qaSourceReadBudget.js"
      - "server/qaWindowsSourceParity.js"
      - "server/qaWindowsReconciliationReview.js"
      - "server/qaWindowsCandidateArchiveStage.js"
      - "scripts/test-qa-windows-candidate-archive-stage.mjs"
      - "scripts/test-qa-windows-reconciliation-integration.mjs"
      - "scripts/Run-QA-Windows-Reconciliation.mjs"
      - "scripts/test-qa-windows-reconciliation-runner.mjs"
      - "scripts/test-qa-windows-pacific-quota-gate.mjs"
      - "scripts/Create-QA-Windows-Reconciliation-Snapshot.ps1"
      - "scripts/test-qa-windows-reconciliation-wrapper.mjs"
      - "scripts/test-qa-windows-reconciliation-review.mjs"
      - "scripts/Run-QA-Windows-Source-Parity.mjs"
      - "scripts/Check-QA-Windows-Source-Parity.ps1"
      - "scripts/test-qa-firestore-rest-snapshot.mjs"
      - "scripts/test-qa-windows-source-parity.mjs"
      - "scripts/test-qa-windows-source-parity-runner.mjs"
      - "scripts/test-qa-windows-source-parity-wrapper.mjs"
      - "scripts/test-qa-source-read-budget-integration.mjs"
      - "migration/qa-source-read-budget-daily.sql"

      - "scripts/test-qa-windows-firestore-metadata-policy.mjs"
      - "scripts/test-qa-windows-firestore-auth-policy.mjs"
      - "scripts/test-qa-windows-stage-check-wrapper.mjs"
      - "scripts/test-qa-windows-private-stage-acceptance.mjs"
      - "scripts/Check-QA-Windows-Replication-Status.ps1"
      - "scripts/test-qa-windows-replication-status-policy.mjs"
      - "scripts/Verify-QA-Windows-Candidate-Archive.mjs"
      - "scripts/Check-QA-Windows-New-Candidate.ps1"
      - "scripts/test-qa-windows-new-candidate-check.mjs"
      - "scripts/test-qa-windows-signal-install-policy.mjs"
      - "scripts/test-qa-windows-private-signal-stage.mjs"
      - "scripts/test-qa-windows-probe-baseline.mjs"
      - "scripts/test-qa-windows-source-signal-integration.mjs"
      - ".github/workflows/qa-core-private-outbox-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify source coverage guard (no live data calls)
        run: |
          node scripts/test-qa-firestore-writer-inventory.mjs
          node scripts/check-qa-no-billing-source-writers.mjs
      - name: Test stage-only outbox authorization and quarantine
        run: |
          node --check server/qaCorePrivateOutbox.js
          node --check server/qaCoreOutboxUncertainty.js
          node --check server/qaCoreMutationCoordinatorStage.js
          node --check server/qaCoreSourceVerificationCandidateStage.js
          node --check server/qaCoreIndependentSourceReadStage.js
          node scripts/test-qa-core-independent-source-read.mjs
          node scripts/test-qa-core-mutation-coordinator.mjs
          node --check server/qaWindowsSourceProbe.js
          node --check scripts/test-qa-windows-source-probe.mjs
          node scripts/test-qa-windows-source-probe.mjs
          node --check server/qaWindowsSourceDocumentReader.js
          node scripts/test-qa-windows-source-document-reader.mjs
          node --check server/qaWindowsSourceSignalJournal.js
          node --check server/qaWindowsProbeBaseline.js
          node scripts/test-qa-windows-probe-baseline.mjs
          node --check server/qaWindowsPrivateSignalStage.js
          node --check server/qaWindowsVerifiedCandidateJournal.js
          node scripts/test-qa-windows-private-signal-stage.mjs
          node scripts/test-qa-windows-signal-install-policy.mjs
          node --check scripts/Check-QA-Windows-Private-Signal-Stage.mjs
          node scripts/test-qa-windows-private-stage-acceptance.mjs
          node scripts/test-qa-windows-replication-status-policy.mjs
          node scripts/test-qa-windows-new-candidate-check.mjs
          node scripts/test-qa-windows-stage-check-wrapper.mjs
          node scripts/test-qa-windows-firestore-auth-policy.mjs
          node scripts/test-qa-windows-firestore-metadata-policy.mjs
          node scripts/test-qa-windows-firestore-one-read-policy.mjs
          node scripts/test-qa-firestore-rest-snapshot.mjs
          node scripts/test-qa-windows-source-parity.mjs
          node scripts/test-qa-windows-source-parity-runner.mjs
          node scripts/test-qa-windows-source-parity-wrapper.mjs
          node --check server/qaWindowsReconciliationReview.js
          node scripts/test-qa-windows-reconciliation-review.mjs
          node --check server/qaWindowsCandidateArchiveStage.js
          node scripts/test-qa-windows-candidate-archive-stage.mjs
          node --check scripts/Run-QA-Windows-Reconciliation.mjs
          node scripts/test-qa-windows-reconciliation-runner.mjs
          node scripts/test-qa-windows-pacific-quota-gate.mjs
          node scripts/test-qa-windows-reconciliation-wrapper.mjs
          node --check server/qaWindowsSourceParity.js
          node --check scripts/Run-QA-Windows-Source-Parity.mjs

      - name: Parse Windows PowerShell installer safely
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/Install-QA-Windows-Private-Signal-Stage.ps1'
            'scripts/Check-QA-Windows-Private-Stage.ps1'
            'scripts/Check-QA-Windows-Firestore-Auth.ps1'
            'scripts/Check-QA-Windows-Firestore-Metadata.ps1'
            'scripts/Check-QA-Windows-Firestore-OneRead.ps1'
            'scripts/Check-QA-Windows-Source-Parity.ps1'
            'scripts/Create-QA-Windows-Reconciliation-Snapshot.ps1'
            'scripts/Check-QA-Windows-Replication-Status.ps1'
            'scripts/Check-QA-Windows-New-Candidate.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ('PowerShell syntax invalid: ' + $script) }
          }
          Write-Output 'PASS Windows PowerShell syntax parse (no execution)'
          node scripts/test-qa-core-private-outbox.mjs
          node scripts/test-qa-core-outbox-uncertainty.mjs
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: qa_cutover_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_cutover_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QA_PG_ISOLATED_TEST: "1"
      QA_TEST_DATABASE_URL: "postgresql://postgres:fixture_only@127.0.0.1:5432/qa_cutover_ci_test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install isolated database driver
        run: npm install --ignore-scripts --no-save --no-package-lock --no-audit --no-fund pg@8.16.3
      - name: Test private PostgreSQL outbox with NO real user data
        run: |
          node scripts/test-qa-core-private-outbox-stage-integration.mjs
          node scripts/test-qa-core-mutation-coordinator-integration.mjs
          node scripts/test-qa-core-source-verification-candidate-integration.mjs
          node scripts/test-qa-windows-source-signal-integration.mjs
          node scripts/test-qa-windows-verified-candidate-integration.mjs
          node scripts/test-qa-windows-firestore-one-read-budget-integration.mjs
          node scripts/test-qa-source-read-budget-integration.mjs
          node scripts/test-qa-windows-reconciliation-integration.mjs

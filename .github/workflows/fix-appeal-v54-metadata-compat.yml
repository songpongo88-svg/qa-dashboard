name: Fix Appeal V54 Metadata Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-appeal-v54-metadata-compat.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply compatibility update
        run: node scripts/tmp-fix-v54-compat.mjs
      - name: Record guide review and clean temporary files
        run: |
          rm .github/workflows/fix-appeal-v54-metadata-compat.yml
          rm scripts/tmp-fix-v54-compat.mjs
          node scripts/check-user-guide.mjs --record --reason "Reviewed appeal v54 compatibility with Case Detail submitter and reviewer metadata" --no-content-change
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix appeal v54 Case Detail metadata compatibility"
          git push

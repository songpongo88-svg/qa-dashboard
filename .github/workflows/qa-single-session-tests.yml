name: QA Single Session PR tests
on:
  pull_request:
    paths:
      - "src/sessionTakeoverPolicy.mjs"
      - "src/lib/evaluation/sessionRecoveryStore.mjs"
      - "server/qaSingleSessionEndpoint.js"
      - "api/sparks-auth.js"
      - "vercel.json"
      - "server/qaSingleSessionAdmin.js"
      - "src/qaSingleSessionClient.ts"
      - "src/evaluationStore.ts"
      - "src/coachingStore.ts"
      - "src/appealStore.ts"
      - "scripts/test-qa-session-write-guards.mjs"
      - "src/QaSessionAdminPanel.tsx"
      - "server/qaFirebaseCredentials.js"
      - "scripts/test-qa-server-credentials.mjs"
      - "scripts/test-qa-single-session-api.mjs"
      - "scripts/test-qa-session-atomic-flow.mjs"
      - "scripts/test-qa-tab-lease.mjs"
      - "scripts/test-qa-legacy-profile-lookup.mjs"
      - "server/qaFirebaseCredentials.js"
      - "src/qaTabLease.mjs"
      - "package.json"
      - "src/CreateEvaluationMockup.tsx"
      - "scripts/test-session-*.mjs"
      - "security/qa-single-session/**"
      - "scripts/test-qa-single-session-firebase-rules.mjs"
      - ".github/workflows/qa-single-session-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Takeover policy
        run: node scripts/test-session-takeover-policy.mjs
      - name: API fail-closed guards
        run: node scripts/test-qa-single-session-api.mjs
      - name: Browser recovery isolation
        run: node scripts/test-session-recovery.mjs
      - name: Trusted QA credential validation
        run: node scripts/test-qa-server-credentials.mjs
      - name: Critical write session preflight
        run: node scripts/test-qa-session-write-guards.mjs
      - name: Atomic takeover end-to-end simulation
        run: npm run test:qa-session-atomic
      - name: Legacy QA username verification
        run: npm run test:qa-legacy-profile
      - name: Same browser multi-tab takeover lock
        run: npm run test:qa-tab-lease

  security-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Firebase emulator-only test tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase-tools @firebase/rules-unit-testing
      - name: Replaced-browser Firestore and Storage rules integration
        run: npx firebase --config security/qa-single-session/firebase.emulator.json emulators:exec --project demo-qa-session --only firestore,storage "node scripts/test-qa-single-session-firebase-rules.mjs"

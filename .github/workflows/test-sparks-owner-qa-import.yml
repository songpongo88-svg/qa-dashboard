name: QA Sparks secure owner credential import
on:
  push:
    branches:
      - feat/sparks-owner-import-from-live-qa-20261111
  pull_request:
    paths:
      - 'api/sparks-admin.js'
      - 'src/QASparks.tsx'
      - 'src/SparksQaCredentialMigration.tsx'
      - 'server/sparksQaCredentialPreflight.js'
      - 'server/sparksQaMigrationRunner.js'
      - 'scripts/test-sparks-qa-credential-preflight.mjs'
      - 'scripts/test-sparks-qa-migration-runner.mjs'
      - '.github/workflows/test-sparks-owner-qa-import.yml'
permissions:
  contents: read
jobs:
  qa-owner-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run synthetic tests without production credentials
        run: node --test scripts/test-sparks-qa-credential-preflight.mjs scripts/test-sparks-qa-migration-runner.mjs
      - name: Verify user guide hashes
        run: node scripts/check-user-guide.mjs

name: One-time Appeal Hotfix Guide Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appeal-hotfix-guide-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove one-time workflow and record guide review
        run: |
          rm .github/workflows/appeal-hotfix-guide-review.yml
          npm run guide:review -- --reason "Reviewed Appeal reviewer full-name resolution and non-blocking appeal data loading hotfix" --no-content-change
      - name: Commit guide review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide-release-review.json .github/workflows/appeal-hotfix-guide-review.yml
          git commit -m "Record guide review for appeal hotfix"
          git push

name: Redeploy Current Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-current-main.yml'

permissions:
  contents: write

jobs:
  verify-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair missing evaluation timestamp helpers
        run: node scripts/repair-production-build.mjs
      - name: Prepare exact final source state
        run: |
          rm .github/workflows/redeploy-current-main.yml
          rm scripts/repair-production-build.mjs
          node scripts/check-user-guide.mjs --record --reason "Restored missing evaluation timestamp helpers required by Dashboard and reviewed Case Detail appeal layout before production redeploy" --no-content-change
          git diff --binary > /tmp/redeploy-final.patch
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Commit only verified source changes
        run: |
          git reset --hard HEAD
          git apply /tmp/redeploy-final.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix production build and redeploy appeal layout"
          git push

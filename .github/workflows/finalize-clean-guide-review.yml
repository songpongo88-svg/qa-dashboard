name: Finalize Clean Guide Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-clean-guide-review.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore normal diagnostics and remove temporary workflow
        shell: bash
        run: |
          cat > .github/workflows/build-diagnostics.yml <<'YAML'
          name: Build Diagnostics

          on:
            push:
              branches: [main]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - run: npm ci
                - run: npm run build
          YAML
          rm -f .github/workflows/finalize-clean-guide-review.yml

      - name: Record review from final clean source
        run: npm run guide:review -- --reason "Reviewed final clean Case Detail appeal metadata order, Appeal Submit recovery, 7 Days Theme label, and restored build diagnostics" --no-content-change

      - name: Verify guide review only
        run: npm run guide:check

      - name: Commit final clean review state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-diagnostics.yml docs/guide-release-review.json
          git add -u -- .github/workflows/finalize-clean-guide-review.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize clean Case Detail appeal and theme deploy"
          git push

name: Finalize Clean Guide Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-clean-guide-review.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record final clean source review
        run: npm run guide:review -- --reason "Reviewed final clean Case Detail appeal metadata order, Appeal Submit recovery, 7 Days Theme label, and normal build diagnostics" --no-content-change

      - name: Verify guide review only
        run: npm run guide:check

      - name: Commit guide review only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide-release-review.json
          if git diff --cached --quiet; then
            echo "No guide review change to commit"
            exit 0
          fi
          git commit -m "Finalize clean guide review for Case Detail deploy"
          git push

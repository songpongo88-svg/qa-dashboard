name: QA Sparks password login regression
on:
  pull_request:
    paths:
      - 'api/sparks-auth.js'
      - 'server/sparksSupabaseAuth.js'
      - 'src/SparksQaPasswordAuth.tsx'
      - 'src/QASparks.tsx'
      - 'src/SparksStandalone.tsx'
      - 'scripts/test-sparks-qa-password-auth.mjs'
      - '.github/workflows/test-sparks-qa-password-auth.yml'
permissions:
  contents: read
jobs:
  auth-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated QA password authentication tests
        run: node --test scripts/test-sparks-qa-password-auth.mjs

name: One-time Guide Review Repair

on:
  push:
    paths:
      - '.github/workflows/guide-review-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate guide review and remove repair workflow
        run: |
          rm .github/workflows/guide-review-repair.yml
          node scripts/check-user-guide.mjs --record --reason "Reviewed Appeal PDF reviewer identity to use the QA full agent name including surname" --no-content-change

      - name: Commit repaired review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair guide review hashes"
          git push
